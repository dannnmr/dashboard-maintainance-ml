<!DOCTYPE html>
<html>
  <head>
    <title>Test Frontend Simple</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
  </head>
  <body>
    <h1>Test Frontend Simple</h1>
    <button onclick="testLogin()">Test Login</button>
    <div id="result"></div>

    <script>
      const BASE_URL = "http://localhost:8000";

      async function testLogin() {
        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = "<p>Testing login...</p>";

        try {
          // Test login
          const loginResponse = await axios.post(`${BASE_URL}/auth/login`, {
            email: "admin@example.com",
            password: "admin123",
          });

          console.log("Login response:", loginResponse.data);
          resultDiv.innerHTML += `<p>✅ Login successful: ${loginResponse.status}</p>`;
          resultDiv.innerHTML += `<p>Token: ${loginResponse.data.access_token.substring(
            0,
            50
          )}...</p>`;

          // Save token to cookie
          Cookies.set("token", loginResponse.data.access_token, { expires: 7 });

          // Test /auth/me
          const meResponse = await axios.get(`${BASE_URL}/auth/me`, {
            headers: {
              Authorization: `Bearer ${loginResponse.data.access_token}`,
            },
          });

          console.log("Me response:", meResponse.data);
          resultDiv.innerHTML += `<p>✅ /auth/me successful: ${meResponse.status}</p>`;
          resultDiv.innerHTML += `<p>User: ${JSON.stringify(
            meResponse.data
          )}</p>`;

          // Save user to cookie
          Cookies.set("user", JSON.stringify(meResponse.data), { expires: 7 });

          // Test /users
          const usersResponse = await axios.get(`${BASE_URL}/users`, {
            headers: {
              Authorization: `Bearer ${loginResponse.data.access_token}`,
            },
          });

          console.log("Users response:", usersResponse.data);
          resultDiv.innerHTML += `<p>✅ /users successful: ${usersResponse.status}</p>`;
          resultDiv.innerHTML += `<p>Users count: ${usersResponse.data.length}</p>`;

          // Test if cookies are set
          const savedToken = Cookies.get("token");
          const savedUser = Cookies.get("user");
          resultDiv.innerHTML += `<p>✅ Token saved: ${
            savedToken ? "Yes" : "No"
          }</p>`;
          resultDiv.innerHTML += `<p>✅ User saved: ${
            savedUser ? "Yes" : "No"
          }</p>`;
        } catch (error) {
          console.error("Error:", error);
          resultDiv.innerHTML += `<p>❌ Error: ${error.message}</p>`;
          if (error.response) {
            resultDiv.innerHTML += `<p>Status: ${error.response.status}</p>`;
            resultDiv.innerHTML += `<p>Data: ${JSON.stringify(
              error.response.data
            )}</p>`;
          }
        }
      }
    </script>
  </body>
</html>
